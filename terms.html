<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/fitup-privacy/terms/">
    <title>Fitup 이용약관 - Redirecting...</title>
    <script>
        // 브라우저 언어에 따라 적절한 약관 페이지로 리다이렉트
        (function() {
            var lang = navigator.language || navigator.userLanguage;
            var basePath = '/fitup-privacy/terms/';
            
            if (lang.startsWith('en')) {
                window.location.href = basePath + 'en/';
            } else if (lang.startsWith('ja')) {
                window.location.href = basePath + 'ja/';
            } else if (lang.startsWith('es')) {
                window.location.href = basePath + 'es/';
            } else {
                window.location.href = basePath; // 한국어 기본
            }
        })();
    </script>
</head>
<body>
    <p>약관 페이지로 이동 중입니다... / Redirecting to Terms of Service...</p>
    <p><a href="/fitup-privacy/terms/">Click here if not redirected</a></p>
</body>
</html>
